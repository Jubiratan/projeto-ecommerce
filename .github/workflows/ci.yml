name: CI Pipeline - Feirinha Shop

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependências
        run: npm install

      - name: Executar testes automatizados
        run: npm test

      - name: Construir Imagem Docker (Prática 3)
        run: docker build -t feirinha-shop:${{ github.run_number }} .

      - name: Gerar artefato versionado
        run: |
          mkdir -p dist
          zip -r dist/feirinha-shop-${{ github.run_number }}.zip src/ package.json package-lock.json Dockerfile

      - name: Salvar artefato no GitHub Actions
        uses: upload-artifact@v4
        with:
          name: artefato-aplicacao
          path: dist/*.zip